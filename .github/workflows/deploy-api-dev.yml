name: Deploy API (dev)

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'apps/api/Dockerfile'
      - 'docker-compose.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-central-1
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          ECR_REPOSITORY: previo-schuco-dev-api
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:latest
          docker build -f apps/api/Dockerfile -t $IMAGE .
          docker push $IMAGE

      - name: Force ECS deployment
        run: |
          aws ecs update-service \
            --cluster previo-schuco-dev-cluster \
            --service previo-schuco-dev-api \
            --force-new-deployment
