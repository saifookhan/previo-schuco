name: Deploy

# Runs after CI finishes successfully on main — never deploys code that
# hasn't passed build+test+docker-build first (see ci.yml).
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          # Self-host profile only (apps/web + apps/api + worker — see
          # README's self-host section); pulls whatever just landed on
          # main and rebuilds only what changed.
          script: |
            cd /root/previo-schuco
            git fetch origin main
            git reset --hard origin/main
            export GIT_COMMIT=$(git rev-parse --short HEAD)
            docker compose --profile selfhost up -d --build
            # Demo data for testers: imports + publishes the sample product
            # family for the seeded Suppli company. Idempotent (skips when it
            # already exists). `run` waits for migrate like the api service
            # does. A failure must not fail the deploy, but is flagged.
            docker compose --profile selfhost run --rm -T api pnpm seed:demo-family \
              || echo "::warning::seed:demo-family failed — demo family may be missing"
            # Stores the change lists of family versions made before they were stored (and after
            # the diff code changes). Idempotent; without it those are just computed on view.
            docker compose --profile selfhost run --rm -T api pnpm backfill:family-changes \
              || echo "::warning::backfill:family-changes failed — older versions' changes are computed on view"
            docker image prune -f
